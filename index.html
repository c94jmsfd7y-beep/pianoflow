<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PianoFlow - 마이크 테스트</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #111;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
    }
    header {
      padding: 16px;
      text-align: center;
      border-bottom: 1px solid #333;
    }
    h1 { margin: 0 0 6px; font-size: 22px; }
    .sub { color: #aaa; font-size: 13px; }
    main { max-width: 900px; margin: 0 auto; padding: 14px; }
    .panel {
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }
    button, input[type=file] {
      font: inherit;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 15px;
      margin: 3px;
      background: #d6a84f;
      color: #111;
      font-weight: 700;
    }
    button:disabled { opacity: .45; }
    input[type=file] {
      width: 100%;
      margin: 8px 0 10px;
      color: #ddd;
    }
    .viewer {
      width: 100%;
      min-height: 55vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      overflow: auto;
      background: #292929;
      border-radius: 12px;
      padding: 10px;
    }
    canvas {
      display: block;
      max-width: 100%;
      height: auto;
      background: white;
      box-shadow: 0 3px 15px #0008;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .status { color: #aaa; font-size: 13px; margin-top: 8px; }
    .mic-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .value {
      background: #101010;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 13px;
      text-align: center;
    }
    .label { color: #999; font-size: 12px; }
    .big { font-size: 30px; font-weight: 800; margin-top: 5px; }
    .help { color: #bbb; font-size: 13px; line-height: 1.6; margin: 8px 0 0; }
    @media (max-width: 600px) {
      .mic-grid { grid-template-columns: 1fr; }
      .viewer { min-height: 48vh; }
    }
  </style>
</head>
<body>
<header>
  <h1>🎹 PianoFlow</h1>
  <div class="sub">PDF 악보 + 피아노 한 음 감지 테스트</div>
</header>

<main>
  <section class="panel">
    <strong>1. PDF 악보</strong>
    <input id="fileInput" type="file" accept="application/pdf,.pdf">
    <div class="row">
      <button id="prevButton">◀ 이전</button>
      <button id="nextButton">다음 ▶</button>
      <button id="fitButton">화면에 맞추기</button>
    </div>
    <div id="fileName" class="status">PDF를 선택해주세요.</div>
    <div id="pageLabel" class="status">페이지 - / -</div>
  </section>

  <section class="panel">
    <strong>2. 마이크 테스트</strong>
    <div class="row">
      <button id="micButton">🎤 마이크 시작</button>
    </div>
    <div class="mic-grid">
      <div class="value">
        <div class="label">감지된 음</div>
        <div id="noteValue" class="big">—</div>
      </div>
      <div class="value">
        <div class="label">주파수</div>
        <div id="freqValue" class="big">— Hz</div>
      </div>
    </div>
    <p id="micStatus" class="help">마이크 시작을 누른 뒤 피아노에서 한 음씩 눌러보세요.</p>
    <p class="help">
      ※ 현재는 <b>한 번에 한 음을 연주하는 기초 테스트</b>입니다.
      코드/화음 인식, 악보 위치 추적, 자동 페이지 넘김은 아직 들어있지 않습니다.
    </p>
  </section>

  <section class="viewer" id="viewer">
    <canvas id="canvas"></canvas>
  </section>
</main>

<script type="module">
  import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";

  const fileInput = document.getElementById("fileInput");
  const viewer = document.getElementById("viewer");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const prevButton = document.getElementById("prevButton");
  const nextButton = document.getElementById("nextButton");
  const fitButton = document.getElementById("fitButton");
  const pageLabel = document.getElementById("pageLabel");
  const fileName = document.getElementById("fileName");

  let pdf = null;
  let pageNumber = 1;
  let renderToken = 0;
  let lastFileBuffer = null;

  async function renderPage() {
    if (!pdf) return;
    const token = ++renderToken;
    const page = await pdf.getPage(pageNumber);
    if (token !== renderToken) return;

    const baseViewport = page.getViewport({ scale: 1 });
    const availableWidth = Math.max(260, viewer.clientWidth - 20);
    const scale = availableWidth / baseViewport.width;
    const viewport = page.getViewport({ scale });

    canvas.width = Math.floor(viewport.width);
    canvas.height = Math.floor(viewport.height);

    await page.render({ canvasContext: ctx, viewport }).promise;
    if (token !== renderToken) return;

    pageLabel.textContent = `페이지 ${pageNumber} / ${pdf.numPages}`;
    prevButton.disabled = pageNumber <= 1;
    nextButton.disabled = pageNumber >= pdf.numPages;
  }

  fileInput.addEventListener("change", async () => {
    const file = fileInput.files?.[0];
    if (!file) return;

    try {
      fileName.textContent = `파일: ${file.name}`;
      lastFileBuffer = await file.arrayBuffer();
      pdf = await pdfjsLib.getDocument({ data: lastFileBuffer }).promise;
      pageNumber = 1;
      await renderPage();
    } catch (e) {
      console.error(e);
      fileName.textContent = "PDF를 불러오지 못했습니다.";
    }
  });

  prevButton.addEventListener("click", async () => {
    if (pdf && pageNumber > 1) {
      pageNumber--;
      await renderPage();
    }
  });

  nextButton.addEventListener("click", async () => {
    if (pdf && pageNumber < pdf.numPages) {
      pageNumber++;
      await renderPage();
    }
  });

  fitButton.addEventListener("click", renderPage);

  window.addEventListener("keydown", async (e) => {
    if (e.key === "ArrowLeft" && pdf && pageNumber > 1) {
      pageNumber--;
      await renderPage();
    }
    if (e.key === "ArrowRight" && pdf && pageNumber < pdf.numPages) {
      pageNumber++;
      await renderPage();
    }
  });

  let resizeTimer;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(renderPage, 150);
  });

  // ---------- Basic monophonic pitch detector ----------
  const micButton = document.getElementById("micButton");
  const noteValue = document.getElementById("noteValue");
  const freqValue = document.getElementById("freqValue");
  const micStatus = document.getElementById("micStatus");

  let audioContext = null;
  let analyser = null;
  let micStream = null;
  let micSource = null;
  let pitchRunning = false;
  let animationId = null;
  let buffer = null;

  const noteNames = ["C", "C♯", "D", "D♯", "E", "F",
                     "F♯", "G", "G♯", "A", "A♯", "B"];

  function frequencyToNote(freq) {
    if (!Number.isFinite(freq) || freq <= 0) return null;
    const midi = Math.round(69 + 12 * Math.log2(freq / 440));
    const note = noteNames[(midi % 12 + 12) % 12];
    const octave = Math.floor(midi / 12) - 1;
    const targetFreq = 440 * Math.pow(2, (midi - 69) / 12);
    const cents = 1200 * Math.log2(freq / targetFreq);
    return { midi, note: `${note}${octave}`, targetFreq, cents };
  }

  function detectPitch(data, sampleRate) {
    // Remove DC offset.
    let mean = 0;
    for (let i = 0; i < data.length; i++) mean += data[i];
    mean /= data.length;

    let rms = 0;
    for (let i = 0; i < data.length; i++) {
      const v = data[i] - mean;
      data[i] = v;
      rms += v * v;
    }
    rms = Math.sqrt(rms / data.length);

    // Ignore near-silence.
    if (rms < 0.008) return null;

    let bestOffset = -1;
    let bestCorrelation = 0;
    const minFreq = 60;
    const maxFreq = 1000;
    const minLag = Math.floor(sampleRate / maxFreq);
    const maxLag = Math.min(Math.floor(sampleRate / minFreq), data.length - 1);

    for (let lag = minLag; lag <= maxLag; lag++) {
      let sum = 0;
      let normA = 0;
      let normB = 0;
      const limit = data.length - lag;

      for (let i = 0; i < limit; i++) {
        const a = data[i];
        const b = data[i + lag];
        sum += a * b;
        normA += a * a;
        normB += b * b;
      }

      const corr = sum / Math.sqrt((normA * normB) || 1);
      if (corr > bestCorrelation) {
        bestCorrelation = corr;
        bestOffset = lag;
      }
    }

    if (bestOffset < 0 || bestCorrelation < 0.35) return null;

    const freq = sampleRate / bestOffset;
    if (freq < 60 || freq > 1000) return null;

    return { freq, correlation: bestCorrelation };
  }

  function pitchLoop() {
    if (!pitchRunning) return;

    analyser.getFloatTimeDomainData(buffer);
    const result = detectPitch(buffer, audioContext.sampleRate);

    if (result) {
      const info = frequencyToNote(result.freq);
      if (info) {
        noteValue.textContent = info.note;
        freqValue.textContent = `${result.freq.toFixed(1)} Hz`;
        micStatus.textContent =
          `감지 중 · 신뢰도 ${(result.correlation * 100).toFixed(0)}%`;
      }
    } else {
      noteValue.textContent = "—";
      freqValue.textContent = "— Hz";
      micStatus.textContent = "소리를 기다리는 중…";
    }

    animationId = requestAnimationFrame(pitchLoop);
  }

  async function startMic() {
    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error("이 브라우저에서 마이크 기능을 사용할 수 없습니다.");
    }

    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    await audioContext.resume();

    micStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false
      }
    });

    micSource = audioContext.createMediaStreamSource(micStream);
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 4096;
    analyser.smoothingTimeConstant = 0;

    buffer = new Float32Array(analyser.fftSize);
    micSource.connect(analyser);

    pitchRunning = true;
    micButton.textContent = "⏹ 마이크 중지";
    micStatus.textContent = "마이크가 켜졌습니다. 피아노에서 한 음을 눌러보세요.";
    pitchLoop();
  }

  function stopMic() {
    pitchRunning = false;
    if (animationId) cancelAnimationFrame(animationId);
    animationId = null;

    if (micStream) {
      micStream.getTracks().forEach(track => track.stop());
      micStream = null;
    }
    if (audioContext) {
      audioContext.close();
      audioContext = null;
    }

    micButton.textContent = "🎤 마이크 시작";
    micStatus.textContent = "마이크가 꺼졌습니다.";
    noteValue.textContent = "—";
    freqValue.textContent = "— Hz";
  }

  micButton.addEventListener("click", async () => {
    if (pitchRunning) {
      stopMic();
      return;
    }

    micButton.disabled = true;
    try {
      await startMic();
    } catch (e) {
      console.error(e);
      micStatus.textContent =
        "마이크를 사용할 수 없습니다. Safari에서 마이크 권한을 허용했는지 확인해주세요.";
      alert("마이크 권한을 허용해주세요. iPad에서는 사이트의 마이크 접근을 허용해야 합니다.");
    } finally {
      micButton.disabled = false;
    }
  });
</script>
</body>
</html>
