<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PianoFlow - 음정 인식 개선 테스트</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}header{padding:16px;text-align:center;border-bottom:1px solid #333}h1{margin:0 0 6px;font-size:22px}.sub{color:#aaa;font-size:13px}main{max-width:900px;margin:0 auto;padding:14px}.panel{background:#1b1b1b;border:1px solid #333;border-radius:14px;padding:14px;margin-bottom:14px}button,input[type=file]{font:inherit}button{border:0;border-radius:10px;padding:11px 15px;margin:3px;background:#d6a84f;color:#111;font-weight:700}button:disabled{opacity:.45}input[type=file]{width:100%;margin:8px 0 10px;color:#ddd}.viewer{width:100%;min-height:55vh;display:flex;align-items:flex-start;justify-content:center;overflow:auto;background:#292929;border-radius:12px;padding:10px}canvas{display:block;max-width:100%;height:auto;background:white;box-shadow:0 3px 15px #0008}.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.status{color:#aaa;font-size:13px;margin-top:8px}.mic-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.value{background:#101010;border:1px solid #333;border-radius:12px;padding:13px;text-align:center}.label{color:#999;font-size:12px}.big{font-size:30px;font-weight:800;margin-top:5px}.help{color:#bbb;font-size:13px;line-height:1.6;margin:8px 0 0}@media(max-width:600px){.mic-grid{grid-template-columns:1fr}.viewer{min-height:48vh}}</style></head>
<body><header><h1>🎹 PianoFlow</h1><div class="sub">PDF 악보 + 피아노 한 음 감지 테스트 (개선판)</div></header><main>
<section class="panel"><strong>1. PDF 악보</strong><input id="fileInput" type="file" accept="application/pdf,.pdf"><div class="row"><button id="prevButton">◀ 이전</button><button id="nextButton">다음 ▶</button><button id="fitButton">화면에 맞추기</button></div><div id="fileName" class="status">PDF를 선택해주세요.</div><div id="pageLabel" class="status">페이지 - / -</div></section>
<section class="panel"><strong>2. 마이크 테스트</strong><div class="row"><button id="micButton">🎤 마이크 시작</button></div><div class="mic-grid"><div class="value"><div class="label">감지된 음</div><div id="noteValue" class="big">—</div></div><div class="value"><div class="label">주파수</div><div id="levelValue" style="margin-top:10px;color:#aaa;font-size:13px">마이크 입력: —</div><div id="freqValue" class="big">— Hz</div></div></div><p id="micStatus" class="help">마이크 시작을 누른 뒤 피아노에서 한 음씩 눌러보세요.</p><p class="help">※ 개선판: 음정 판정을 여러 번 확인하고, 소리가 잠깐 약해져도 표시를 바로 지우지 않습니다. 화음 인식과 악보 위치 추적, 자동 페이지 넘김은 아직 구현되지 않았습니다.</p></section><section class="viewer" id="viewer"><canvas id="canvas"></canvas></section></main>
<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";
const $=id=>document.getElementById(id),fileInput=$('fileInput'),viewer=$('viewer'),canvas=$('canvas'),ctx=canvas.getContext('2d'),prevButton=$('prevButton'),nextButton=$('nextButton'),fitButton=$('fitButton'),pageLabel=$('pageLabel'),fileName=$('fileName');let pdf=null,pageNumber=1,renderToken=0;
async function renderPage(){if(!pdf)return;const token=++renderToken,page=await pdf.getPage(pageNumber);if(token!==renderToken)return;const base=page.getViewport({scale:1}),scale=Math.max(260,viewer.clientWidth-20)/base.width,viewport=page.getViewport({scale});canvas.width=Math.floor(viewport.width);canvas.height=Math.floor(viewport.height);await page.render({canvasContext:ctx,viewport}).promise;if(token!==renderToken)return;pageLabel.textContent=`페이지 ${pageNumber} / ${pdf.numPages}`;prevButton.disabled=pageNumber<=1;nextButton.disabled=pageNumber>=pdf.numPages}
fileInput.addEventListener('change',async()=>{const file=fileInput.files?.[0];if(!file)return;try{fileName.textContent=`파일: ${file.name}`;pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;pageNumber=1;await renderPage()}catch(e){console.error(e);fileName.textContent='PDF를 불러오지 못했습니다.'}});
prevButton.addEventListener('click',async()=>{if(pdf&&pageNumber>1){pageNumber--;await renderPage()}});nextButton.addEventListener('click',async()=>{if(pdf&&pageNumber<pdf.numPages){pageNumber++;await renderPage()}});fitButton.addEventListener('click',renderPage);window.addEventListener('keydown',async e=>{if(e.key==='ArrowLeft'&&pdf&&pageNumber>1){pageNumber--;await renderPage()}if(e.key==='ArrowRight'&&pdf&&pageNumber<pdf.numPages){pageNumber++;await renderPage()}});let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(renderPage,150)});
// Improved single-note pitch detector: normalized autocorrelation + temporal stabilization.
const micButton=$('micButton'),noteValue=$('noteValue'),freqValue=$('freqValue'),micStatus=$('micStatus'),levelValue=$('levelValue');let audioContext=null,analyser=null,micStream=null,micSource=null,pitchRunning=false,animationId=null,buffer=null,workBuffer=null,lastDetectTime=0,lastGoodAt=0,lastShown=null;const candidates=[];const noteNames=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
function frequencyToNote(freq){if(!Number.isFinite(freq)||freq<=0)return null;const midi=Math.round(69+12*Math.log2(freq/440)),note=noteNames[(midi%12+12)%12],octave=Math.floor(midi/12)-1,targetFreq=440*Math.pow(2,(midi-69)/12),cents=1200*Math.log2(freq/targetFreq);return{midi,note:`${note}${octave}`,targetFreq,cents}}
function detectPitch(data,sampleRate){const decimation=2,n=Math.floor(data.length/decimation);if(n<512)return null;let mean=0;for(let i=0;i<n;i++)mean+=data[i*decimation];mean/=n;let rms=0;for(let i=0;i<n;i++){const v=data[i*decimation]-mean;workBuffer[i]=v;rms+=v*v}rms=Math.sqrt(rms/n);levelValue.textContent=`마이크 입력: ${(rms*100).toFixed(1)}%`;if(rms<0.0022)return{silent:true,rms};const sr=sampleRate/decimation,minFreq=70,maxFreq=1000,minLag=Math.floor(sr/maxFreq),maxLag=Math.min(Math.floor(sr/minFreq),n-2);let bestLag=-1,bestCorr=-1;const correlations=new Float32Array(maxLag+2);for(let lag=minLag;lag<=maxLag;lag++){let sum=0,a2=0,b2=0;const limit=n-lag;for(let i=0;i<limit;i++){const a=workBuffer[i],b=workBuffer[i+lag];sum+=a*b;a2+=a*a;b2+=b*b}const corr=sum/Math.sqrt((a2*b2)||1);correlations[lag]=corr;if(corr>bestCorr){bestCorr=corr;bestLag=lag}}
if(bestLag<0||bestCorr<0.25)return null;let refined=bestLag;if(bestLag>minLag&&bestLag<maxLag){const y1=correlations[bestLag-1],y2=correlations[bestLag],y3=correlations[bestLag+1],den=2*(y1-2*y2+y3);if(Math.abs(den)>1e-6)refined+=(y1-y3)/den}const freq=sr/refined;if(freq<minFreq||freq>maxFreq)return null;return{freq,correlation:bestCorr,rms}}
function pitchLoop(now){if(!pitchRunning)return;analyser.getFloatTimeDomainData(buffer);if(now-lastDetectTime>=55){lastDetectTime=now;const result=detectPitch(buffer,audioContext.sampleRate);if(result&&!result.silent){const info=frequencyToNote(result.freq);if(info&&result.correlation>=0.25){candidates.push({midi:info.midi,freq:result.freq,correlation:result.correlation,at:now});while(candidates.length>7)candidates.shift();const recent=candidates.filter(c=>now-c.at<350);const counts=new Map();for(const c of recent)counts.set(c.midi,(counts.get(c.midi)||0)+c.correlation);let winner=null;for(const [midi,score] of counts)if(!winner||score>winner.score)winner={midi,score};const votes=recent.filter(c=>c.midi===winner?.midi);if(votes.length>=2){const chosen=votes.reduce((a,b)=>a.correlation>b.correlation?a:b);const chosenInfo=frequencyToNote(440*Math.pow(2,(chosen.midi-69)/12));noteValue.textContent=chosenInfo.note;freqValue.textContent=`${chosen.freq.toFixed(1)} Hz`;micStatus.textContent=`감지 중 · 신뢰도 ${(chosen.correlation*100).toFixed(0)}%`;lastGoodAt=now;lastShown=chosenInfo.note}}}else if(now-lastGoodAt>450){noteValue.textContent='—';freqValue.textContent='— Hz';micStatus.textContent='마이크는 작동 중 · 피아노에서 한 음을 들려주세요.';candidates.splice(0,candidates.length)}}animationId=requestAnimationFrame(pitchLoop)}
async function startMic(){if(!navigator.mediaDevices?.getUserMedia)throw new Error('이 브라우저에서 마이크 기능을 사용할 수 없습니다.');audioContext=new(window.AudioContext||window.webkitAudioContext)();await audioContext.resume();micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});micSource=audioContext.createMediaStreamSource(micStream);analyser=audioContext.createAnalyser();analyser.fftSize=4096;analyser.smoothingTimeConstant=0;buffer=new Float32Array(analyser.fftSize);workBuffer=new Float32Array(Math.floor(analyser.fftSize/2));micSource.connect(analyser);pitchRunning=true;lastDetectTime=0;lastGoodAt=0;candidates.length=0;micButton.textContent='⏹ 마이크 중지';micStatus.textContent='마이크가 켜졌습니다. 피아노에서 한 음을 길게 눌러보세요.';pitchLoop(performance.now())}
function stopMic(){pitchRunning=false;if(animationId)cancelAnimationFrame(animationId);animationId=null;if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null}if(audioContext){audioContext.close();audioContext=null}micButton.textContent='🎤 마이크 시작';micStatus.textContent='마이크가 꺼졌습니다.';noteValue.textContent='—';levelValue.textContent='마이크 입력: —';freqValue.textContent='— Hz';candidates.length=0}
micButton.addEventListener('click',async()=>{if(pitchRunning){stopMic();return}micButton.disabled=true;try{await startMic()}catch(e){console.error(e);micStatus.textContent='마이크를 사용할 수 없습니다. Safari에서 마이크 권한을 허용했는지 확인해주세요.';alert('마이크 권한을 허용해주세요. iPad에서는 사이트의 마이크 접근을 허용해야 합니다.')}finally{micButton.disabled=false}});
</script></body></html>
